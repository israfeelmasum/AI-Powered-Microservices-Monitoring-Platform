# scripts/create_indices.py
#!/usr/bin/env python3

import requests
import json
from datetime import datetime

# Elasticsearch configuration
ES_URL = "http://localhost:9200"

# Index templates
INDICES = {
    "monitoring-logs": {
        "mappings": {
            "properties": {
                "timestamp": {"type": "date"},
                "service": {"type": "keyword"},
                "level": {"type": "keyword"},
                "message": {"type": "text"},
                "correlation_id": {"type": "keyword"},
                "endpoint": {"type": "keyword"},
                "method": {"type": "keyword"},
                "status_code": {"type": "integer"},
                "response_time": {"type": "float"},
                "client_ip": {"type": "ip"},
                "user_agent": {"type": "text"},
                "error_type": {"type": "keyword"},
                "system_metrics": {
                    "properties": {
                        "cpu_percent": {"type": "float"},
                        "memory_mb": {"type": "float"},
                        "memory_percent": {"type": "float"}
                    }
                }
            }
        },
        "settings": {
            "index": {
                "number_of_shards": 1,
                "number_of_replicas": 0,
                "refresh_interval": "5s"
            }
        }
    },
    "monitoring-metrics": {
        "mappings": {
            "properties": {
                "timestamp": {"type": "date"},
                "service": {"type": "keyword"},
                "metrics": {"type": "object", "dynamic": True}
            }
        },
        "settings": {
            "index": {
                "number_of_shards": 1,
                "number_of_replicas": 0
            }
        }
    },
    "monitoring-anomalies": {
        "mappings": {
            "properties": {
                "timestamp": {"type": "date"},
                "service": {"type": "keyword"},
                "anomaly_id": {"type": "keyword"},
                "type": {"type": "keyword"},
                "severity": {"type": "keyword"},
                "description": {"type": "text"},
                "recommendation": {"type": "text"},
                "detected_by": {"type": "keyword"},
                "model": {"type": "keyword"}
            }
        }
    },
    "monitoring-health": {
        "mappings": {
            "properties": {
                "timestamp": {"type": "date"},
                "service": {"type": "keyword"},
                "status": {"type": "keyword"},
                "checks": {"type": "object", "dynamic": True},
                "system_metrics": {"type": "object", "dynamic": True}
            }
        }
    }
}

def create_index(index_name, config):
    """Create an Elasticsearch index"""
    print(f"Creating index: {index_name}")
    
    try:
        response = requests.put(
            f"{ES_URL}/{index_name}",
            headers={"Content-Type": "application/json"},
            data=json.dumps(config),
            timeout=30
        )

        if response.status_code in [200, 201]:
            print(f"✅ Index {index_name} created successfully")
        elif response.status_code == 400 and "already exists" in response.text:
            print(f"ℹ️  Index {index_name} already exists")
        else:
            print(f"❌ Failed to create index {index_name}: {response.status_code}")
            print(response.text)
            
    except requests.exceptions.RequestException as e:
        print(f"❌ Error creating index {index_name}: {e}")

def main():
    print("🗂️  Creating Elasticsearch indices...")

    # Wait for Elasticsearch to be ready
    print("⏳ Waiting for Elasticsearch...")
    import time
    for _ in range(30):
        try:
            response = requests.get(f"{ES_URL}/_cluster/health", timeout=5)
            if response.status_code == 200:
                print("✅ Elasticsearch is ready")
                break
        except:
            pass
        time.sleep(2)
    else:
        print("❌ Elasticsearch not ready after 60 seconds")
        return

    # Create indices
    for index_name, config in INDICES.items():
        create_index(index_name, config)

    print("🎉 Elasticsearch indices setup complete!")

if __name__ == "__main__":
    main()

