# scripts/setup_kibana.py
#!/usr/bin/env python3

import requests
import json
import time

KIBANA_URL = "http://localhost:5601"

# Index patterns
INDEX_PATTERNS = [
    {
        "id": "monitoring-logs-*",
        "title": "monitoring-logs-*",
        "timeFieldName": "timestamp"
    },
    {
        "id": "monitoring-metrics-*",
        "title": "monitoring-metrics-*",
        "timeFieldName": "timestamp"
    },
    {
        "id": "monitoring-anomalies-*",
        "title": "monitoring-anomalies-*",
        "timeFieldName": "timestamp"
    }
]

# Sample dashboard
DASHBOARD = {
    "version": "8.8.0",
    "objects": [
        {
            "id": "monitoring-overview",
            "type": "dashboard",
            "attributes": {
                "title": "Monitoring Overview",
                "description": "Central monitoring dashboard for microservices",
                "panelsJSON": json.dumps([
                    {
                        "gridData": {"x": 0, "y": 0, "w": 24, "h": 15},
                        "panelIndex": "1",
                        "embeddableConfig": {},
                        "panelRefName": "panel_1"
                    }
                ]),
                "timeRestore": True,
                "timeTo": "now",
                "timeFrom": "now-24h",
                "refreshInterval": {"pause": False, "value": 30000}
            }
        }
    ]
}

def wait_for_kibana():
    """Wait for Kibana to be ready"""
    print("⏳ Waiting for Kibana to be ready...")

    for attempt in range(60):
        try:
            response = requests.get(f"{KIBANA_URL}/api/status", timeout=5)
            if response.status_code == 200:
                print("✅ Kibana is ready")
                return True
        except:
            pass
        time.sleep(5)

    print("❌ Kibana not ready after 5 minutes")
    return False

def create_index_pattern(pattern):
    """Create Kibana index pattern"""
    print(f"Creating index pattern: {pattern['title']}")
    
    payload = {
        "attributes": {
            "title": pattern["title"],
            "timeFieldName": pattern["timeFieldName"]
        }
    }

    try:
        response = requests.post(
            f"{KIBANA_URL}/api/saved_objects/index-pattern/{pattern['id']}",
            headers={
                "Content-Type": "application/json",
                "kbn-xsrf": "true"
            },
            data=json.dumps(payload),
            timeout=30
        )

        if response.status_code in [200, 201]:
            print(f"✅ Index pattern {pattern['title']} created")
        elif response.status_code == 409:
            print(f"ℹ️  Index pattern {pattern['title']} already exists")
        else:
            print(f"❌ Failed to create index pattern: {response.status_code}")
            
    except Exception as e:
        print(f"❌ Error creating index pattern: {e}")

def create_dashboard():
    """Create monitoring dashboard"""
    print("Creating monitoring dashboard...")

    try:
        response = requests.post(
            f"{KIBANA_URL}/api/saved_objects/_import",
            headers={"kbn-xsrf": "true"},
            files={"file": ("dashboard.ndjson", json.dumps(DASHBOARD))},
            timeout=30
        )

        if response.status_code == 200:
            print("✅ Dashboard created successfully")
        else:
            print(f"❌ Failed to create dashboard: {response.status_code}")
            
    except Exception as e:
        print(f"❌ Error creating dashboard: {e}")

def main():
    print("📈 Setting up Kibana dashboards...")

    if not wait_for_kibana():
        return

    # Create index patterns
    for pattern in INDEX_PATTERNS:
        create_index_pattern(pattern)

    # Create dashboard
    create_dashboard()
    
    print("🎉 Kibana setup complete!")
    print(f"🌐 Access Kibana at: {KIBANA_URL}")

if __name__ == "__main__":
    main()

