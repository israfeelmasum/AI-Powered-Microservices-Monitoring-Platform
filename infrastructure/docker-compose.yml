# scripts/seed_data.py
#!/usr/bin/env python3

import requests
import json
import time
import random
from datetime import datetime, timedelta

# Service URLs
MONITORING_URL = "http://localhost:8000"
NOTE_SERVICE_URL = "http://localhost:8001"

def create_sample_notes():
    """Create sample notes to generate monitoring data"""
    print("📝 Creating sample notes...")
    
    sample_notes = [
        {"title": "Meeting Notes", "content": "Quarterly planning meeting notes", "tags": ["meeting", "planning"]},
        {"title": "Project Ideas", "content": "New feature ideas for the platform", "tags": ["ideas", "features"]},
        {"title": "Bug Reports", "content": "List of reported bugs to fix", "tags": ["bugs", "fixes"]},
        {"title": "Code Review", "content": "Notes from recent code reviews", "tags": ["code", "review"]},
        {"title": "Performance Tests", "content": "Results from performance testing", "tags": ["performance", "testing"]}
    ]

    created_notes = []

    for note_data in sample_notes:
        try:
            response = requests.post(
                f"{NOTE_SERVICE_URL}/notes",
                json=note_data,
                timeout=10
            )

            if response.status_code == 200:
                note = response.json()
                created_notes.append(note)
                print(f"✅ Created note: {note['title']}")
            else:
                print(f"❌ Failed to create note: {response.status_code}")
                
            # Add some delay to create realistic timing data
            time.sleep(random.uniform(0.1, 0.5))
            
        except Exception as e:
            print(f"❌ Error creating note: {e}")
    
    return created_notes

def generate_traffic():
    """Generate some API traffic for monitoring"""
    print("🚦 Generating API traffic...")
    
    endpoints = [
        ("GET", "/notes"),
        ("GET", "/health"),
        ("GET", "/notes?tag=meeting"),
        ("GET", "/notes?skip=0&limit=5")
    ]

    for _ in range(20):
        method, endpoint = random.choice(endpoints)

        try:
            if method == "GET":
                response = requests.get(f"{NOTE_SERVICE_URL}{endpoint}", timeout=5)

            print(f"📡 {method} {endpoint} -> {response.status_code}")
            
            # Random delay between requests
            time.sleep(random.uniform(0.1, 1.0))

        except Exception as e:
            print(f"❌ Error generating traffic: {e}")

def trigger_test_scenarios():
    """Trigger various test scenarios for monitoring"""
    print("🧪 Triggering test scenarios...")

    # Test slow endpoint
    try:
        print("⏳ Testing slow endpoint...")
        response = requests.get(f"{NOTE_SERVICE_URL}/test/slow", timeout=10)
        print(f"✅ Slow endpoint: {response.status_code}")
    except Exception as e:
        print(f"❌ Slow endpoint error: {e}")
    
    # Test error endpoint
    try:
        print("💥 Testing error endpoint...")
        response = requests.get(f"{NOTE_SERVICE_URL}/test/error", timeout=5)
        print(f"❌ Error endpoint: {response.status_code}")
    except Exception as e:
        print(f"✅ Error endpoint triggered: {e}")
    
    # Test memory endpoint
    try:
        print("🧠 Testing memory endpoint...")
        response = requests.get(f"{NOTE_SERVICE_URL}/test/memory", timeout=10)
        print(f"✅ Memory endpoint: {response.status_code}")
    except Exception as e:
        print(f"❌ Memory endpoint error: {e}")

def check_monitoring_data():
    """Check if monitoring data is being collected"""
    print("📊 Checking monitoring data collection...")

    try:
        # Check Elasticsearch for logs
        response = requests.get("http://localhost:9200/monitoring-logs-*/_search", timeout=5)
        if response.status_code == 200:
            data = response.json()
            hit_count = data['hits']['total']['value']
            print(f"✅ Found {hit_count} log entries in Elasticsearch")
        else:
            print(f"❌ Failed to query Elasticsearch: {response.status_code}")
            
    except Exception as e:
        print(f"❌ Error checking monitoring data: {e}")

def main():
    print("🌱 Seeding monitoring system with sample data...")

    # Wait for services to be ready
    print("⏳ Waiting for services...")
