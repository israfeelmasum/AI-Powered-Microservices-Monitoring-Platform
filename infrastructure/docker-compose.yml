# infrastructure/docker-compose.yml
version: '3.8'

services:
  # Elasticsearch for log storage
  elasticsearch:
    image: elasticsearch:8.8.0
    container_name: monitoring_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
      - ./elasticsearch/config/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml
    networks:
      - monitoring-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Kibana for visualization
  kibana:
    image: kibana:8.8.0
    container_name: monitoring_kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    volumes:
      - ./kibana/config/kibana.yml:/usr/share/kibana/config/kibana.yml
    networks:
      - monitoring-network
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Redis for caching and session storage
  redis:
    image: redis:7-alpine
    container_name: monitoring_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - monitoring-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Ollama for AI processing
  ollama:
    image: ollama/ollama:latest
    container_name: monitoring_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./ollama/models:/models
    networks:
      - monitoring-network
    environment:
      - OLLAMA_HOST=0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Monitoring Core Service
  monitoring-core:
    build:
      context: ../monitoring-core
      dockerfile: Dockerfile
    container_name: monitoring_core
    ports:
      - "8000:8000"
    environment:
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - REDIS_URL=redis://redis:6379
      - OLLAMA_URL=http://ollama:11434
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - SECRET_KEY=${SECRET_KEY}
      - NOTE_SERVICE_SECRET=${NOTE_SERVICE_SECRET}
      - USER_SERVICE_SECRET=${USER_SERVICE_SECRET}
      - ORDER_SERVICE_SECRET=${ORDER_SERVICE_SECRET}
      - PAYMENT_SERVICE_SECRET=${PAYMENT_SERVICE_SECRET}
    volumes:
      - ./monitoring-core/logs:/app/logs
    networks:
      - monitoring-network
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    restart: unless-stopped

  # Note Service
  note-service:
    build:
      context: ../microservices/note-service
      dockerfile: Dockerfile
    container_name: note_service
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - MONITORING_URL=http://monitoring-core:8000
      - NOTE_SERVICE_SECRET=${NOTE_SERVICE_SECRET}
      - MONITORING_ADMIN_USERNAME=${ADMIN_USERNAME}
      - MONITORING_ADMIN_PASSWORD=${ADMIN_PASSWORD}
    networks:
      - monitoring-network
    depends_on:
      - monitoring-core
    restart: unless-stopped

volumes:
  elasticsearch_data:
  redis_data:
  ollama_data:

networks:
  monitoring-network:
    driver: bridge

---
# monitoring-core/Dockerfile
FROM python:3.11-slim

WORKDIR /app

# Install system dependencies
RUN apt-get update && apt-get install -y \
    curl \
    && rm -rf /var/lib/apt/lists/*

# Copy requirements and install Python dependencies
COPY requirements.txt .
RUN pip install --no-cache-dir -r requirements.txt

# Copy application code
COPY . .

# Create logs directory
RUN mkdir -p logs

# Expose port
EXPOSE 8000

# Health check
HEALTHCHECK --interval=30s --timeout=10s --start-period=5s --retries=3 \
    CMD curl -f http://localhost:8000/health || exit 1

# Run the application
CMD ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

