# scripts/setup.sh
#!/bin/bash

echo "🚀 Setting up Centralized Monitoring System..."

# Check if Docker is installed
if ! command -v docker &> /dev/null; then
    echo "❌ Docker is not installed. Please install Docker first."
    exit 1
fi

if ! command -v docker-compose &> /dev/null; then
    echo "❌ Docker Compose is not installed. Please install Docker Compose first."
    exit 1
fi

# Create necessary directories
echo "📁 Creating directories..."
mkdir -p monitoring-core/logs
mkdir -p elasticsearch/data
mkdir -p redis/data
mkdir -p ollama/models
mkdir -p kibana/data

# Set permissions
echo "🔒 Setting permissions..."
chmod 755 monitoring-core/logs
chmod 755 elasticsearch/data
chmod 755 redis/data
chmod 755 ollama/models
chmod 755 kibana/data

# Build and start services
echo "🏗️  Building and starting services..."
cd infrastructure
docker-compose up -d

# Wait for services to be ready
echo "⏳ Waiting for services to be ready..."
sleep 30

# Check service health
echo "🏥 Checking service health..."

check_service() {
    local service_name=$1
    local url=$2
    local max_attempts=30
    local attempt=1
    
    echo "Checking $service_name..."
    while [ $attempt -le $max_attempts ]; do
        if curl -f -s "$url" > /dev/null 2>&1; then
            echo "✅ $service_name is ready"
            return 0
        fi
        echo "⏳ Attempt $attempt/$max_attempts: $service_name not ready yet..."
        sleep 10
        attempt=$((attempt + 1))
    done
    echo "❌ $service_name failed to start"
    return 1
}

# Check each service
check_service "Elasticsearch" "http://localhost:9200/_cluster/health"
check_service "Kibana" "http://localhost:5601/api/status"
check_service "Redis" "http://localhost:6379" # Will fail gracefully for Redis
check_service "Monitoring Core" "http://localhost:8000/health"
check_service "Note Service" "http://localhost:8001/health"

# Setup Ollama models
echo "🤖 Setting up Ollama models..."
docker exec monitoring_ollama ollama pull mistral
docker exec monitoring_ollama ollama pull llama2

# Create Elasticsearch indices
echo "📊 Creating Elasticsearch indices..."
python3 scripts/create_indices.py

# Create Kibana dashboards
echo "📈 Setting up Kibana dashboards..."
python3 scripts/setup_kibana.py

echo "🎉 Setup complete!"
echo ""
echo "🌐 Access URLs:"
echo "   • Monitoring Dashboard: http://localhost:8000 (admin/admin)"
echo "   • Kibana: http://localhost:5601"
echo "   • Note Service: http://localhost:8001"
echo "   • Elasticsearch: http://localhost:9200"
echo ""
echo "📚 Test the system:"
echo "   curl http://localhost:8001/notes"
echo "   curl http://localhost:8000/health"

