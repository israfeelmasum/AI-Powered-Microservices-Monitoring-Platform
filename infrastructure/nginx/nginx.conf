# infrastructure/nginx/nginx.conf (for production load balancing)
events {
    worker_connections 1024;
}

http {
    upstream monitoring_backend {
        server monitoring-core:8000;
        # Add more instances for load balancing
        # server monitoring-core-2:8000;
        # server monitoring-core-3:8000;
    }

    upstream note_service_backend {
        server note-service:8001;
        # Add more instances for load balancing
        # server note-service-2:8001;
    }

    server {
        listen 80;
        server_name localhost;

        # Monitoring dashboard
        location / {
            proxy_pass http://monitoring_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Note service
        location /notes/ {
            proxy_pass http://note_service_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}