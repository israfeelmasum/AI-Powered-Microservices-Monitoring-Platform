# monitoring-core/docker-compose.yml
version: '3.8'

services:
  monitoring-core:
    build: .
    container_name: monitoring_core
    ports:
      - "8000:8000"
    environment:
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - REDIS_URL=redis://redis:6379
      - OLLAMA_URL=http://ollama:11434
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - SECRET_KEY=${SECRET_KEY}
      - NOTE_SERVICE_SECRET=${NOTE_SERVICE_SECRET}
    volumes:
      - ./logs:/app/logs
    depends_on:
      - elasticsearch
      - redis
      - ollama
    networks:
      - monitoring-network
    restart: unless-stopped

  elasticsearch:
    image: elasticsearch:8.8.0
    container_name: monitoring_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - monitoring-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: monitoring_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - monitoring-network
    command: redis-server --appendonly yes

  ollama:
    image: ollama/ollama:latest
    container_name: monitoring_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - monitoring-network
    environment:
      - OLLAMA_HOST=0.0.0.0

volumes:
  elasticsearch_data:
  redis_data:
  ollama_data:

networks:
  monitoring-network:
    driver: bridge

---
# elasticsearch/config/elasticsearch.yml
cluster.name: "monitoring-cluster"
node.name: "monitoring-node-1"
path.data: /usr/share/elasticsearch/data
path.logs: /usr/share/elasticsearch/logs
network.host: 0.0.0.0
http.port: 9200
discovery.type: single-node
xpack.security.enabled: false
xpack.monitoring.collection.enabled: true

# Performance settings
indices.memory.index_buffer_size: 20%
indices.memory.min_index_buffer_size: 96mb
indices.lifecycle.poll_interval: 10m
action.auto_create_index: true

---
# kibana/config/kibana.yml
server.name: monitoring-kibana
server.host: 0.0.0.0
server.port: 5601
elasticsearch.hosts: ["http://elasticsearch:9200"]
monitoring.ui.container.elasticsearch.enabled: true

logging.appenders:
  file:
    type: file
    fileName: /var/log/kibana/kibana.log
    layout:
      type: json

logging.loggers:
  - name: plugins.spaces
    level: error

server.maxPayload: 1048576
elasticsearch.requestTimeout: 30000
elasticsearch.shardTimeout: 30000

---
# ollama/models/setup.sh
#!/bin/bash

echo "🤖 Setting up Ollama models..."

# Wait for Ollama to be ready
while ! curl -f http://localhost:11434/api/tags >/dev/null 2>&1; do
    echo "Waiting for Ollama to be ready..."
    sleep 5
done

echo "📥 Pulling Mistral model..."
ollama pull mistral

echo "📥 Pulling LLaMA2 model..."
ollama pull llama2

echo "✅ Ollama models setup complete!"

