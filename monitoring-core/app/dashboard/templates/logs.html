{% extends "base.html" %}

{% block title %}Logs - Centralized Monitoring{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1>
        <i class="fas fa-file-alt me-2"></i>
        Log Viewer
    </h1>
    <input type="text" class="form-control w-25" id="logSearch" placeholder="Search logs...">
</div>

<div class="card">
    <div class="card-header">
        <h6 class="mb-0"><i class="fas fa-list me-2"></i> Recent Logs</h6>
    </div>
    <div class="card-body" id="logs-container">
        <div class="text-center py-4">
            <div class="spinner-border" role="status">
                <span class="visually-hidden">Loading logs...</span>
            </div>
            <p class="text-muted mt-2">Loading recent logs...</p>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener("DOMContentLoaded", async () => {
    try {
        const res = await fetch("/api/v1/monitoring/logs?hours=1");
        const logs = await res.json();

        renderLogs(logs);
        setupSearch();
    } catch (err) {
        console.error(err);
        document.getElementById("logs-container").innerHTML = `
            <div class="alert alert-danger">
                <i class="fas fa-exclamation-triangle me-2"></i> Failed to load logs.
            </div>
        `;
    }
});

function renderLogs(logs) {
    const container = document.getElementById("logs-container");

    if (!logs || logs.length === 0) {
        container.innerHTML = `
            <div class="alert alert-info">
                <i class="fas fa-info-circle me-2"></i> No logs available.
            </div>
        `;
        return;
    }

    let html = `
        <div class="table-responsive">
            <table class="table table-sm table-hover" id="logsTable">
                <thead>
                    <tr>
                        <th>Timestamp</th>
                        <th>Level</th>
                        <th>Service</th>
                        <th>Endpoint</th>
                        <th>Message</th>
                    </tr>
                </thead>
                <tbody>`;

    logs.forEach(log => {
        const levelClass = getLevelClass(log.level);
        html += `
            <tr>
                <td>${new Date(log.timestamp).toLocaleString()}</td>
                <td><span class="badge bg-${levelClass}">${log.level}</span></td>
                <td>${log.service || '-'}</td>
                <td>${log.endpoint || '-'}</td>
                <td>${log.message || ''}</td>
            </tr>
        `;
    });

    html += `</tbody></table></div>`;
    container.innerHTML = html;
}

function getLevelClass(level) {
    switch ((level || '').toUpperCase()) {
        case "ERROR": return "danger";
        case "CRITICAL": return "danger";
        case "WARNING": return "warning";
        case "INFO": return "primary";
        case "DEBUG": return "secondary";
        default: return "light";
    }
}

function setupSearch() {
    const input = document.getElementById("logSearch");
    input.addEventListener("input", function () {
        const filter = this.value.toLowerCase();
        const rows = document.querySelectorAll("#logsTable tbody tr");

        rows.forEach(row => {
            row.style.display = row.innerText.toLowerCase().includes(filter) ? "" : "none";
        });
    });
}
</script>
{% endblock %}
