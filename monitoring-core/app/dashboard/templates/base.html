<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Monitoring Platform{% endblock %}</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body>
<div class="container-fluid p-0">
  <div class="row g-0">

    <!-- ── Sidebar ──────────────────────────────────────────────────────── -->
    <div class="col-md-2 sidebar">

      <!-- Brand -->
      <div class="sidebar-brand">
        <div class="sidebar-brand-icon">🔭</div>
        <div>
          <div class="sidebar-brand-text">Monitoring</div>
          <div class="sidebar-brand-sub">AI-Powered Platform</div>
        </div>
      </div>

      <!-- Navigation -->
      <nav class="nav flex-column gap-1">
        <a class="nav-link {% if page == 'overview' %}active{% endif %}" href="/dashboard/">
          <i class="fas fa-gauge-high"></i> Overview
        </a>
        <a class="nav-link {% if page == 'services' %}active{% endif %}" href="/dashboard/services">
          <i class="fas fa-cubes"></i> Services
        </a>
        <a class="nav-link {% if page == 'logs' %}active{% endif %}" href="/dashboard/logs">
          <i class="fas fa-scroll"></i> Logs
        </a>
        <a class="nav-link {% if page == 'ai' %}active{% endif %}" href="/dashboard/ai-insights">
          <i class="fas fa-brain"></i> AI Insights
        </a>
        <hr style="border-color:rgba(255,255,255,.15);margin:.5rem 0;">
        <a class="nav-link" href="/kibana" target="_blank">
          <i class="fas fa-chart-area"></i> Kibana
        </a>
        <a class="nav-link" href="/docs" target="_blank">
          <i class="fas fa-book-open"></i> API Docs
        </a>
      </nav>

      <!-- Footer -->
      <div class="sidebar-footer mt-auto">
        <div class="sidebar-user">
          <div class="sidebar-user-avatar">
            <i class="fas fa-user" style="font-size:.75rem;color:rgba(255,255,255,.8);"></i>
          </div>
          <div>
            <div style="font-weight:600;color:#fff;font-size:.78rem;">{{ username }}</div>
            <div style="font-size:.68rem;color:rgba(255,255,255,.55);">Administrator</div>
          </div>
        </div>
        <button id="logout-btn" class="btn btn-sm w-100"
          style="background:rgba(239,68,68,.20);color:rgba(255,255,255,.85);border:1px solid rgba(239,68,68,.35);border-radius:10px;">
          <i class="fas fa-right-from-bracket me-1"></i> Sign Out
        </button>
      </div>
    </div>

    <!-- ── Main Content ──────────────────────────────────────────────────── -->
    <div class="col-md-10 main-content">
      {% block content %}{% endblock %}
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("logout-btn")?.addEventListener("click", () => {
    if (confirm("Sign out of the monitoring dashboard?")) {
      const xhr = new XMLHttpRequest();
      xhr.open("GET", "/logout", true);
      xhr.setRequestHeader("Authorization", "Basic " + btoa("logout:logout"));
      xhr.onreadystatechange = () => {
        if (xhr.readyState === 4) window.location.replace(window.location.href);
      };
      xhr.send();
    }
  });
});
</script>
{% block scripts %}{% endblock %}
</body>
</html>
